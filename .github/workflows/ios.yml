name: iOS Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  API_BASE_URL: https://elhadrami.pythonanywhere.com

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build iOS app (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Reservily-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: Reservily-ios-unsigned
          path: Reservily-unsigned.ipa
          retention-days: 90

  build-signed-ipa:
    name: Build signed IPA
    runs-on: macos-latest
    timeout-minutes: 60
    needs: build-unsigned-ipa
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          HAS_ALL: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        run: echo "has_all=$HAS_ALL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.has_all == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.has_all == 'true'
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Import signing certificate
        if: steps.secrets.outputs.has_all == 'true'
        run: |
          echo "${{ secrets.APPLE_CERT_P12_BASE64 }}" | base64 --decode > cert.p12
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          KEYCHAIN="$RUNNER_TEMP/ios.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA
        if: steps.secrets.outputs.has_all == 'true'
        run: |
          flutter pub get
          flutter build ipa --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.has_all == 'true'
        with:
          name: Reservily-ios-signed
          path: build/ios/ipa/*.ipa
          retention-days: 90

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-unsigned-ipa, build-signed-ipa]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Reservily-ios-unsigned
          path: release/

      - name: Attach signed IPA if present
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Reservily-ios-signed
          path: release/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Reservily iOS $GITHUB_REF_NAME" \
            --notes "Fresh build of main with the latest updates. API: ${{ env.API_BASE_URL }}" \
            || gh release upload "$GITHUB_REF_NAME" release/* --clobber